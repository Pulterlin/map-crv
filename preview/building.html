<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18605A">
  <title>A栋一楼·深圳生鲜配送中心</title>
  <link rel="stylesheet" href="styles.css?v=floor-100">
  <link rel="stylesheet" href="floor.css?v=floor-100">
</head>
<body>
  <header class="topbar"><a class="brand" href="./" aria-label="返回园区全景"><img class="brand-logo" src="./logo-crv.png" alt="华润万家"><span class="brand-name"><strong>深圳生鲜配送中心</strong><small>Shenzhen Distribution Center</small></span></a><a class="floor-top-back" href="./">← 返回园区全景</a></header>
  <main class="floor-page">
    <div class="floor-intro"><div class="floor-breadcrumb"><a href="./">园区全景</a><span>／</span><strong id="building-crumb">A栋</strong><span>／</span><strong id="floor-crumb">1F</strong></div><div class="floor-intro-row"><div><span class="eyebrow">INSIDE THE DISTRIBUTION CENTER</span><h1 id="floor-title">A栋·一楼功能区</h1><p id="floor-subtitle">恒温、冷藏分区与30个卸货码头</p></div><span class="floor-badge" id="floor-badge">1F</span></div></div>
    <div class="floor-layout">
      <aside class="floor-panel" aria-label="功能区查找"><label class="floor-search"><span aria-hidden="true">⌕</span><input id="floor-search" type="search" placeholder="搜索功能区或码头，如A17" aria-label="搜索一楼功能区和码头"></label><div class="floor-filters" aria-label="区域分类"><button class="active" data-floor-filter="all" aria-pressed="true">全部</button><button data-floor-filter="zone" aria-pressed="false">功能区</button><button data-floor-filter="dock" aria-pressed="false">码头</button></div><div id="floor-info" class="floor-info" aria-live="polite"><span class="eyebrow">FLOOR GUIDE</span><h2>选择一个区域</h2><p>点击平面图或下方列表，查看功能区与码头信息。</p></div><div class="floor-list-heading">区域索引 <span id="floor-count"></span></div><div id="floor-list" class="floor-list"></div></aside>
      <section class="floor-board" aria-label="一楼交互式平面图"><div class="floor-board-toolbar"><div><strong id="floor-board-title">A栋一楼</strong><small>库内导览 · 点击区域查看 · 可缩放</small></div><div class="floor-zoom"><button id="floor-zoom-out" aria-label="缩小平面图">−</button><button id="floor-zoom-in" aria-label="放大平面图">＋</button><button id="floor-fit">适合屏幕</button></div></div><div class="route-toolbar" aria-label="库内动线选择"><strong>库内动线</strong><div id="route-options" class="route-options"></div><span id="route-status" class="route-status" aria-live="polite"></span></div><div id="floor-viewport" class="floor-viewport"><svg id="floor-svg" viewBox="300 180 1320 1060" role="group" aria-label="A栋一楼功能区与码头导览图"></svg></div><div class="floor-legend"><span><i class="ambient"></i>恒温区</span><span><i class="cold"></i>冷藏区</span><span><i class="support"></i>配套区域</span><span><i class="dock"></i>卸货码头</span></div></section>
    </div>
    <p id="floor-note" class="floor-note"></p>
  </main>
  <script type="module" src="building.js?v=floor-100"></script>
</body>
</html>
